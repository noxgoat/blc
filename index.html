<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BNMP</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bnmp-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
:root,:root[data-theme="dark"]{
--bg:#0b0e1a;--surface:#151a2b;--surface-2:#1b2236;--surface-3:#232c45;
--ink:#eef1fb;--ink-2:#aab3d0;--ink-3:#6e7793;
--border:#283251;--border-strong:#394566;
--accent:#6c7cff;--accent-2:#4fd1e0;--accent-hover:#8693ff;--accent-ink:#ffffff;--accent-soft:#1d2546;--accent-soft-ink:#aeb8ff;
--success:#34d399;--success-soft:#11271f;--success-ink:#6ee7b7;
--warn:#fbbf24;--warn-soft:#2c2510;--warn-ink:#fcd34d;
--danger:#fb7185;--danger-soft:#2e1622;--danger-ink:#fda4b4;
--gold:#fbbf24;--gold-soft:#2c2510;--gold-ink:#fcd34d;
--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 8px 28px rgba(0,0,0,.5);--shadow-lg:0 26px 70px rgba(0,0,0,.62);
--login-bg:radial-gradient(1100px 560px at 80% -10%,#1a2444 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#14283a 0%,transparent 55%),var(--bg);
--font-serif:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
--font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--radius:14px;--radius-sm:9px;--radius-lg:20px;
}
:root[data-theme="light"]{
--bg:#f4f6fc;--surface:#ffffff;--surface-2:#eef1f9;--surface-3:#e6eaf5;
--ink:#161a2b;--ink-2:#5b6480;--ink-3:#9098b0;
--border:#e2e7f2;--border-strong:#cfd6e7;
--accent:#5562f0;--accent-2:#1ca3b8;--accent-hover:#4350d6;--accent-ink:#ffffff;--accent-soft:#e7e9fd;--accent-soft-ink:#4350d6;
--success:#1f9d6b;--success-soft:#def3ea;--success-ink:#167a52;
--warn:#c98a16;--warn-soft:#f8eed3;--warn-ink:#97670f;
--danger:#e23d63;--danger-soft:#fbe2e9;--danger-ink:#c02850;
--gold:#c98a16;--gold-soft:#f8eed3;--gold-ink:#97670f;
--shadow-sm:0 1px 2px rgba(30,38,70,.05);--shadow:0 6px 20px rgba(30,38,70,.09);--shadow-lg:0 20px 54px rgba(30,38,70,.18);
--login-bg:radial-gradient(1200px 600px at 80% -10%,#e6ebfb 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#e1f0f3 0%,transparent 55%),var(--bg);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:transparent;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01";letter-spacing:-.002em;transition:background-color .2s ease,color .2s ease;}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:600;letter-spacing:-.02em;margin:0;}
a{color:var(--accent);text-decoration:none;}a:hover{text-decoration:underline;}
button{font-family:inherit;}
svg{width:18px;height:18px;flex-shrink:0;}
.hidden{display:none!important;}.muted{color:var(--ink-2);}.faint{color:var(--ink-3);}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.row{display:flex;align-items:center;gap:10px;}
.col{display:flex;flex-direction:column;gap:4px;}
.grow{flex:1;}.nowrap{white-space:nowrap;}

/* RIPPLE */
.btn,.nome-item,.pager button{position:relative;overflow:hidden;}
.ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);animation:ripple-anim .55s ease-out forwards;}
:root[data-theme="dark"] .ripple{background:rgba(255,255,255,.22);}
:root[data-theme="light"] .ripple{background:rgba(0,0,0,.10);}
.btn-primary .ripple{background:rgba(255,255,255,.28);}
.btn-danger .ripple{background:rgba(255,200,200,.3);}
@keyframes ripple-anim{to{transform:scale(4);opacity:0;}}

/* BUTTONS */
.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .14s ease;display:inline-flex;align-items:center;gap:8px;line-height:1;user-select:none;}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent);}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 80%,transparent);}
.btn-primary:active{transform:translateY(0);}
.btn-danger{color:var(--danger-ink);border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:13px;}
.btn svg{width:16px;height:16px;transition:transform .2s ease;}
.btn:hover svg{transform:scale(1.08);}

/* INPUTS */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);}
.input,.select{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;transition:border-color .14s,box-shadow .14s;}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent);}
.input::placeholder{color:var(--ink-3);}
.select option{color:var(--ink);background:var(--surface);}
.hint{font-size:12.5px;color:var(--ink-3);}

/* SEGMENTED */
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;}
.segmented button{border:none;background:transparent;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .12s;}
.segmented button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 12px -6px var(--accent);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--border);}
.badge.owner{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent;}
.badge.admin{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent;}
.badge.parceiro{background:var(--surface-3);color:var(--ink-2);}
.badge.aberto{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent;}
.badge.voltado{background:var(--success-soft);color:var(--success-ink);border-color:transparent;}
.badge.off{background:var(--danger-soft);color:var(--danger-ink);border-color:transparent;}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:border-color .2s ease;}
.card:hover{border-color:var(--border-strong);}
.card-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card-head h3{font-family:var(--font-serif);font-weight:700;font-size:16px;}
.card-body{padding:18px;}

/* LOGIN */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:transparent;}
.login-card{width:100%;max-width:392px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:32px 30px;}
.login-card .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;}
.login-card .brand .logo{width:38px;height:38px;border-radius:10px;overflow:hidden;display:grid;place-items:center;}
.login-card .brand .logo img,.sidebar .brand .logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
.login-card h1{font-family:var(--font-serif);font-weight:800;font-size:22px;margin-bottom:3px;}
.login-card .sub{color:var(--ink-2);font-size:13.5px;margin-bottom:24px;}
.login-card .field{margin-bottom:14px;}
.login-card .btn{width:100%;justify-content:center;margin-top:6px;padding:11px;}
.login-error{background:var(--danger-soft);color:var(--danger-ink);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;margin-bottom:14px;}
.login-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--ink-3);}
.theme-fab{position:fixed;top:18px;right:18px;z-index:10;}

/* APP SHELL */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:transparent;}
.sidebar{background:linear-gradient(180deg,rgba(23,26,43,.92) 0%,rgba(16,18,30,.95) 100%)!important;border-right:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);display:flex;flex-direction:column;padding:20px 14px;gap:6px;position:sticky;top:0;height:100vh;
--sb-accent:#7c8bff;--sb-accent-2:#4fd1e0;--sb-text:#eef1ff;--sb-text-2:#9aa3c4;--sb-hover:rgba(255,255,255,.06);--sb-active:rgba(124,139,255,.14);}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.sidebar .brand .logo{width:32px;height:32px;border-radius:9px;overflow:hidden;display:grid;place-items:center;flex-shrink:0;}
.sidebar .brand .t{font-family:var(--font-serif);font-weight:600;font-size:15px;line-height:1.1;color:var(--sb-text);}
.sidebar .brand .t small{display:block;font-family:var(--font-sans);font-size:10.5px;color:var(--sb-text-2);font-weight:500;line-height:1.25;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:12px;color:var(--sb-text-2);font-size:14.5px;font-weight:600;cursor:pointer;transition:color .3s ease,background .35s cubic-bezier(.22,1,.36,1),transform .35s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;animation:sbIn .42s cubic-bezier(.22,1,.36,1) both;}
.nav a:nth-child(1){animation-delay:.03s;}.nav a:nth-child(2){animation-delay:.08s;}.nav a:nth-child(3){animation-delay:.13s;}.nav a:nth-child(4){animation-delay:.18s;}.nav a:nth-child(5){animation-delay:.23s;}
@keyframes sbIn{from{opacity:0;transform:translateX(-10px);}}
.nav a::before{content:"";position:absolute;left:0;top:50%;width:3px;height:0;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--sb-accent),var(--sb-accent-2));transform:translateY(-50%);transition:height .24s cubic-bezier(.22,1,.36,1);}
.nav a:hover{color:var(--sb-text);background:var(--sb-hover)!important;transform:translateX(5px);text-decoration:none;}
.nav a:hover::before{height:20px;}
.nav a.active{color:#fff!important;background:var(--sb-active)!important;}
.nav a.active::before{height:60%;}
.nav a svg{width:34px;height:34px;padding:8px;border-radius:10px;opacity:.95;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:transform .35s cubic-bezier(.22,1,.36,1),background .35s ease,box-shadow .35s ease,filter .35s ease,color .3s ease;}
.nav a:hover svg{opacity:1;background:rgba(124,139,255,.18);box-shadow:inset 0 0 0 1px rgba(124,139,255,.35);transform:scale(1.08) translateY(-1px);filter:drop-shadow(0 4px 10px rgba(124,139,255,.45));}
.nav a.active svg{color:var(--sb-accent-2);background:linear-gradient(135deg,rgba(124,139,255,.22),rgba(79,209,224,.22));box-shadow:inset 0 0 0 1px rgba(79,209,224,.35);opacity:1;animation:sbIconPulse 2.6s ease-in-out infinite;}
@keyframes sbIconPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(79,209,224,0));}50%{filter:drop-shadow(0 2px 9px rgba(79,209,224,.65));}}
.sidebar .sb-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;}
.userchip{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex-shrink:0;}
.userchip .nm{font-size:13.5px;font-weight:600;line-height:1.15;color:var(--sb-text);}
.userchip .rl{font-size:11.5px;color:var(--sb-text-2);display:flex;align-items:center;gap:6px;}
.sb-actions{display:flex;gap:6px;margin-top:4px;}
.sb-actions .btn{flex:1;justify-content:center;color:var(--sb-text-2);border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.03);transition:all .18s ease;}
.sb-actions .btn:hover{color:var(--sb-text);background:var(--sb-hover);border-color:rgba(255,255,255,.2);transform:translateY(-1px);}
.sb-actions .btn:hover svg{transform:rotate(-12deg) scale(1.1);}
.avatar.avatar-icon{color:#0b0e1a;}
.avatar.avatar-icon svg{width:20px;height:20px;}
.sidebar .avatar{width:42px;height:42px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.12);animation:avFloat 4.5s ease-in-out infinite;}
@keyframes avFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.avatar.avatar-img{overflow:hidden;padding:0;background:var(--surface-3);}
.avatar.avatar-img img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar.av-lg{width:56px;height:56px;border-radius:16px;}
.role-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.role-dot.role-owner{background:#fbbf24;box-shadow:0 0 6px #fbbf24;}
.role-dot.role-admin{background:#7c8bff;box-shadow:0 0 6px #7c8bff;}
.role-dot.role-parceiro{background:#4fd1e0;box-shadow:0 0 6px #4fd1e0;}

/* MAIN */
.main{display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 30px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(10px) saturate(115%);-webkit-backdrop-filter:blur(10px) saturate(115%);position:sticky;top:0;z-index:5;}
.topbar h2{font-family:var(--font-serif);font-weight:700;font-size:22px;margin-top:2px;}
.topbar .crumb{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--accent-soft-ink);}
.content{padding:24px 30px 60px;max-width:1180px;width:100%;animation:viewIn .35s cubic-bezier(.22,1,.36,1) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:22px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.8;}
.stat .k{font-size:12.5px;color:var(--ink-2);font-weight:600;}
.stat .v{font-family:var(--font-serif);font-size:30px;font-weight:600;margin-top:6px;line-height:1;}
.stat .v small{font-size:15px;color:var(--ink-3);font-family:var(--font-sans);}
.stat.accent .v{color:var(--accent);}

/* CREDIT METER */
.meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pips{display:inline-flex;gap:5px;}
.pip{width:13px;height:13px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border-strong);}
.pip.free{background:var(--success);border-color:var(--success);}

/* TABLES */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:14px;}
thead th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td .actions{display:flex;gap:6px;justify-content:flex-end;}
td.right,th.right{text-align:right;}

/* PERSON */
.person{display:flex;align-items:flex-start;gap:16px;padding:18px;border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:var(--shadow-sm);margin-bottom:18px;}
.person .pa{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:20px;flex-shrink:0;}
.person .pn{font-family:var(--font-serif);font-weight:700;font-size:19px;}
.person .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:13px;color:var(--ink-2);}
.person .meta b{color:var(--ink);font-weight:600;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start;}

/* ITEMS */
.item{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--surface);}
.item:last-child{margin-bottom:0;}
.item .t{font-weight:600;font-size:14px;}
.item .s{font-size:12.5px;color:var(--ink-2);margin-top:2px;}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.6;}
.empty .big{font-family:var(--font-serif);font-size:17px;color:var(--ink-2);margin-bottom:4px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,14,11,.55);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .12s ease;}
.modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .14s ease;}
.modal-head{padding:20px 22px 0;}
.modal-head h3{font-size:19px;}
.modal-head p{color:var(--ink-2);font-size:13.5px;margin:6px 0 0;}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;}
.modal-error{background:var(--danger-soft);color:var(--danger-ink);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;}
@keyframes fade{from{opacity:0;}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}}

/* TOASTS */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80;}
.toast{background:#161b2e;color:#fff;padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.08);font-size:14px;max-width:360px;display:flex;align-items:flex-start;gap:10px;animation:slidein .16s ease;}
.toast.ok{background:linear-gradient(135deg,#15803d,#22c55e);border-color:transparent;}
.toast.err{background:linear-gradient(135deg,#be123c,#f43f5e);border-color:transparent;}
.toast svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
@keyframes slidein{from{opacity:0;transform:translateX(20px);}}

/* SPINNER */
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .6s linear infinite;}
.center-load{display:grid;place-items:center;padding:50px;color:var(--ink-3);}
@keyframes spin{to{transform:rotate(360deg);}}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 130% at 50% 40%,rgba(0,0,0,.30) 0%,rgba(0,0,0,.65) 62%,rgba(0,0,0,.90) 100%);}
:root[data-theme="light"] body::after{background:radial-gradient(130% 130% at 50% 40%,rgba(250,249,245,.60) 0%,rgba(250,249,245,.80) 62%,rgba(250,249,245,.95) 100%);}
html::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;border:7px solid #000;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 140px rgba(0,0,0,.35);}

/* HERO */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:26px 28px;margin-bottom:22px;border-radius:22px;border:1px solid var(--border);background:radial-gradient(420px 200px at 100% 0%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 70%),linear-gradient(120deg,color-mix(in srgb,var(--accent) 26%,transparent) 0%,color-mix(in srgb,var(--accent) 6%,transparent) 42%,transparent 70%),var(--surface);box-shadow:var(--shadow);}
.hero::after{content:"";position:absolute;right:-80px;top:-90px;width:240px;height:240px;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 40%,transparent),color-mix(in srgb,var(--accent-2) 40%,transparent),transparent 70%);filter:blur(28px);opacity:.55;pointer-events:none;animation:heroBlob 14s linear infinite;}
@keyframes heroBlob{to{transform:rotate(360deg);}}
.hero .hero-av{width:78px;height:78px;border-radius:22px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 10px 26px rgba(0,0,0,.4);background:var(--surface-3);}
.hero .hero-av img{width:100%;height:100%;object-fit:cover;display:block;}
.hero .hero-main{position:relative;z-index:1;min-width:240px;flex:1;}
.hero .hi{font-size:13px;font-weight:600;color:var(--accent-soft-ink);letter-spacing:.02em;}
.hero h1{font-family:var(--font-serif);font-size:30px;font-weight:800;line-height:1.05;margin:4px 0 8px;}
.hero .hero-sub{color:var(--ink-2);font-size:14px;max-width:52ch;}
.hero .hero-aside{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.hero .hero-credits{background:rgba(255,255,255,.05);border:1px solid var(--border-strong);border-radius:14px;padding:12px 16px;text-align:right;min-width:150px;}
.hero .hero-credits .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;}
.hero .hero-credits .meter{justify-content:flex-end;margin-top:6px;}

/* SEARCH LOADER */
.search-loader{display:flex;flex-direction:column;align-items:center;gap:22px;padding:48px 20px;}
.search-loader .radar{position:relative;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at center,rgba(124,139,255,.10),transparent 70%);display:grid;place-items:center;}
.search-loader .radar::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(124,139,255,.18);}
.search-loader .radar::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(79,209,224,.55) 60deg,transparent 130deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:radarSpin 1.1s linear infinite;}
@keyframes radarSpin{to{transform:rotate(360deg);}}
.search-loader .radar svg{width:30px;height:30px;color:var(--accent);animation:lupaPulse 1.4s ease-in-out infinite;}
@keyframes lupaPulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.15);opacity:1;}}
.search-loader .ld-text{font-size:14px;color:var(--ink-2);font-weight:600;letter-spacing:.01em;}
.search-loader .ld-text::after{content:"";animation:dots 1.4s steps(4,end) infinite;}
@keyframes dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}

/* SKELETON */
.skeleton-grid{width:100%;max-width:720px;display:grid;gap:12px;}
.sk-line{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;}
.sk-line.w70{width:70%;}.sk-line.w50{width:50%;}.sk-line.w90{width:90%;}
.sk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:grid;gap:10px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}

/* NOME LIST */
.nome-list{display:grid;gap:10px;}
.nome-item{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);color:var(--ink);font-family:inherit;transition:border-color .2s ease,transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,background .2s ease;}
.nome-item:hover{border-color:var(--accent);transform:translateX(4px);box-shadow:var(--shadow-sm);background:var(--surface-3);}
.nome-item:disabled{opacity:.5;cursor:not-allowed;}
.nome-item .pa{width:42px;height:42px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));overflow:visible;}
.nome-item .pa svg.ico-preso{width:23px;height:23px;color:#fff;overflow:visible;}
.nome-item .pa svg.ico-preso .fig{transform-box:fill-box;transform-origin:50% 30%;animation:presoSway 3.2s ease-in-out infinite;}
.nome-item .pa svg.ico-preso .bars{opacity:.5;animation:presoBars 3.2s ease-in-out infinite;}
@keyframes presoSway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
@keyframes presoBars{0%,100%{opacity:.42;}50%{opacity:.7;}}
.nome-item:hover .pa svg.ico-preso .fig{animation-duration:1.1s;}
.nome-item:hover .pa{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);}
.nome-item .info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.nome-item .nm{font-family:var(--font-serif);font-weight:700;font-size:15px;}
.nome-item .mt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);align-items:center;}
.nome-item .mt b{color:var(--ink);font-weight:600;}
.nome-item .st-badge{flex-shrink:0;align-self:center;}
.nome-list .nome-item{animation:nomeItemIn .4s cubic-bezier(.22,1,.36,1) both;}
.nome-list .nome-item:nth-child(1){animation-delay:.02s;}.nome-list .nome-item:nth-child(2){animation-delay:.06s;}.nome-list .nome-item:nth-child(3){animation-delay:.10s;}.nome-list .nome-item:nth-child(4){animation-delay:.14s;}.nome-list .nome-item:nth-child(5){animation-delay:.18s;}
@keyframes nomeItemIn{from{opacity:0;transform:translateY(10px);}}
.card.nome-card{border-radius:var(--radius-lg);overflow:hidden;border-color:color-mix(in srgb,var(--accent) 35%,var(--border));}
.card.nome-card>.card-head{background:var(--surface-2)!important;}
.nome-card .bar-load{height:2px;border-radius:2px;overflow:hidden;margin-bottom:2px;background:transparent;}
.nome-card.paging .bar-load{background:var(--surface-3);}
.nome-card.paging .bar-load::before{content:"";display:block;height:100%;width:38%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:barSlide .9s ease-in-out infinite;}
@keyframes barSlide{0%{margin-left:-38%;}100%{margin-left:100%;}}
.nome-card .nome-list{transition:opacity .2s ease,filter .2s ease;}
.nome-card.paging .nome-list{opacity:.4;filter:blur(1px);pointer-events:none;}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-top:18px;}
.pager button{min-width:36px;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden;}
.pager button:hover:not(:disabled):not(.cur){border-color:var(--accent);color:var(--ink);transform:translateY(-1px);}
.pager button.cur{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;}
.pager button:disabled{opacity:.35;cursor:default;}
.pager .ell{color:var(--ink-3);padding:0 2px;}

/* CONFIG */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;}
.check-row{display:flex;align-items:flex-start;gap:9px;margin-top:18px;font-size:13.5px;color:var(--ink-2);cursor:pointer;line-height:1.45;}
.check-row input[type="checkbox"]{margin-top:2px;width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.cfg-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2);}
.cfg-steps li::marker{color:var(--accent);font-weight:700;}
.live-card .card-body{padding-top:6px;}
.live-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.live-row:last-of-type{border-bottom:0;}
.live-row .grow{flex:1;min-width:0;}
.live-t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.live-ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);}
.live-ico svg{width:18px;height:18px;}
.live-ico.ok{background:var(--success-soft);color:var(--success-ink);border-color:transparent;}
.live-ico.off{background:var(--danger-soft);color:var(--danger-ink);border-color:transparent;}
.live-ico.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent;}
.live-foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-3);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success-ink);animation:livePulse 1.8s ease-out infinite;}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--success-ink) 55%,transparent);}70%{box-shadow:0 0 0 7px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

/* AUDIT */
.aud-card .card-body{display:flex;flex-direction:column;gap:14px;}
.aud-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.aud-search{position:relative;flex:1 1 260px;display:flex;align-items:center;}
.aud-search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--ink-3);pointer-events:none;}
.aud-search .input{padding-left:36px;width:100%;}
.aud-filters .select{flex:0 0 auto;min-width:150px;}

/* RESULT SECTIONS */
.res-sections{display:grid;gap:14px;margin-top:18px;}
.res-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:secIn .38s cubic-bezier(.22,1,.36,1) both;}
.res-section:nth-child(1){animation-delay:.02s;}.res-section:nth-child(2){animation-delay:.07s;}.res-section:nth-child(3){animation-delay:.12s;}.res-section:nth-child(4){animation-delay:.17s;}.res-section:nth-child(5){animation-delay:.22s;}.res-section:nth-child(6){animation-delay:.27s;}.res-section:nth-child(7){animation-delay:.32s;}
@keyframes secIn{from{opacity:0;transform:translateY(12px);}}
.res-section-head{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;gap:10px;}
.res-section-head .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.res-section-head .ico svg{width:14px;height:14px;}
.res-section-head .lbl{font-family:var(--font-serif);font-weight:700;font-size:14px;}
.res-section-head .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);}
.res-section-body{padding:14px 16px;}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.kv{display:flex;flex-direction:column;gap:2px;}
.kv .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;}
.kv .v{font-size:14px;color:var(--ink);font-weight:500;}

/* SCORE METER */
.score-bar{height:8px;border-radius:4px;background:var(--surface-3);margin-top:8px;overflow:hidden;}
.score-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--danger),var(--warn),var(--success));transition:width .8s cubic-bezier(.22,1,.36,1);}
.score-val{font-family:var(--font-serif);font-size:28px;font-weight:700;color:var(--accent);}

/* MANDADOS */
.mand-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.mand-item:last-child{border-bottom:none;padding-bottom:0;}
.mand-item .mnd-num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
.mand-item .mnd-proc{font-size:12px;color:var(--ink-3);margin-top:2px;}
.mand-item .mnd-acts{display:flex;gap:8px;flex-shrink:0;}

/* OFFLINE BANNER */
.offline-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,var(--warn-soft) 0%,color-mix(in srgb,var(--warn-soft) 60%,transparent) 100%);border-bottom:1px solid var(--warn-ink);color:var(--warn-ink);font-size:13.5px;font-weight:500;}
.offline-banner svg{width:16px;height:16px;flex-shrink:0;}

/* ATTR */
.attr{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.25);z-index:39;pointer-events:none;white-space:nowrap;letter-spacing:.05em;}

/* RESPONSIVE */
@media(max-width:880px){.two-col,.three-col{grid-template-columns:1fr;}.app{grid-template-columns:1fr;}.sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;}.nav{flex-direction:row;flex-wrap:wrap;}.sidebar .sb-foot{margin:0 0 0 auto;border:none;padding:0;}.sb-actions{margin-top:0;}}
@media(max-width:760px){.hero{padding:22px;}.hero h1{font-size:24px;}.hero .hero-aside{align-items:flex-start;width:100%;}.kv-grid{grid-template-columns:1fr 1fr;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@supports not((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sidebar{background:var(--surface-2)!important;}.topbar{background:var(--bg);}}
</style>
</head>

<script>
'use strict';
const API={
  async req(method,path,body){
    const base='/a'+'pi';const opts={method,headers:{},credentials:'same-origin'};
    if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    const res=await fetch(base+path,opts);
    const ct=res.headers.get('content-type')||'';let data=null;
    if(ct.includes('application/json'))data=await res.json().catch(()=>null);
    if(!res.ok){const e=new Error((data&&data.error)||('Erro '+res.status));e.status=res.status;throw e;}
    return data;
  },
  get(p){return this.req('GET',p);},post(p,b){return this.req('POST',p,b===undefined?{}:b);},
  put(p,b){return this.req('PUT',p,b===undefined?{}:b);},patch(p,b){return this.req('PATCH',p,b===undefined?{}:b);},
  del(p){return this.req('DELETE',p);},
  async postBlob(p,b){
    const base='/a'+'pi';const opts={method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(b===undefined?{}:b)};
    const res=await fetch(base+p,opts);
    if(!res.ok){const ct=res.headers.get('content-type')||'';const data=ct.includes('application/json')?await res.json().catch(()=>null):null;const e=new Error((data&&data.error)||('Erro '+res.status));e.status=res.status;throw e;}
    return res.blob();
  },
};

  let me;try{const r=await API.get('/me');me=r.user;}catch(e){c.innerHTML=errCard(e.message);return;}

  c.innerHTML='<div class="hero"><div class="hero-av"><img src="'+DEFAULT_AVATAR+'" alt="avatar"></div><div class="hero-main"><div class="hi">Operacao ativa</div><h1>Buscar mandado</h1><p class="hero-sub">Pesquise por CPF ou nome para localizar mandados, ver dados completos e emitir comprovante.</p></div><div class="hero-aside"><div class="hero-credits"><div class="lbl">Creditos</div>'+cred+'</div></div></div><div class="card" style="margin-bottom:16px"><div class="card-body"><form id="sf" style="display:flex;gap:10px;align-items:flex-end"><div class="field grow"><label>CPF ou nome completo</label><input class="input" id="sq" placeholder="000.000.000-00 ou JOAO DA SILVA" autocomplete="off"></div><button class="btn btn-primary" type="submit">'+I.search+'<span>Buscar</span></button></form></div></div><div id="res"></div>';
  $('#sf').addEventListener('submit',async e=>{
    e.preventDefault();const q=$('#sq').value.trim();if(!q){toast('Digite um CPF ou nome','err');return;}
    const ra=$('#res');
    ra.innerHTML='<div class="search-loader"><div class="radar">'+I.search+'</div><div class="ld-text">Consultando BNMP</div></div>';
    try{
      const r=await API.post('/buscar',{query:q});
      state.search={query:q,result:r};syncState();
      renderResult(r);
    }catch(e){ra.innerHTML='<div class="empty">'+I.alert+'<div class="big">Nenhum resultado</div><div>'+esc(e.message)+'</div></div>';}
  });
}
function renderResult(r){
const ra=$('#res');if(!ra)return;
const {pessoa,mandados=[]}=r;
const pends=mandados.filter(w=>!w.retrieved).length;
ra.innerHTML='<div class="res-sections">'+

// PESSOAL
'<div class="res-section"><div class="res-section-head"><span class="ico">'+I.shield+'</span><span class="lbl">Dados Pessoais</span></div><div class="res-section-body"><div class="kv-grid">'+
kv('Nome',pessoa.nome)+kv('CPF',fmtCpf(pessoa.cpf))+kv('Nascimento',fmtDate(pessoa.nascimento))+kv('RJI',pessoa.rji||'-')+
'</div></div></div>'+

// MANDADOS
'<div class="res-section"><div class="res-section-head"><span class="ico" style="background:linear-gradient(135deg,'+(pends?'var(--danger)':'var(--success)')+','+(pends?'#ff6b6b':'#06b6d4')+')">'+ I.justice+'</span><span class="lbl">Mandados de Prisao</span><span class="cnt"><span class="badge '+(pends?'aberto':'voltado')+'">'+ pends+' pendente'+(pends!==1?'s':'')+'</span></span></div><div class="res-section-body"><div id="wl">'+(mandados.length?mandadosHTML(mandados):'<div class="empty" style="padding:20px"><div class="big">Nenhum mandado</div></div>')+'</div></div></div>'+

'</div>';

bindWarrants();
}
function kv(k,v){return '<div class="kv"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function mandadosHTML(ws){
  return ws.map(w=>{
    const isC=w.retrieved;
    return '<div class="mand-item"><div><div class="spread" style="gap:8px"><span class="badge '+(isC?'voltado':'aberto')+'">'+(isC?'Cumprido':'Pendente')+'</span><span class="mnd-num">'+esc(w.numero)+'</span></div><div class="mnd-proc">Processo: '+esc(w.numeroProcesso)+'</div></div><div class="mnd-acts">'+
    (isC?'<button class="btn btn-sm" data-wid="'+w.id+'" data-cid="c'+w.id+'" data-act="voltar">'+I.undo+'<span>Voltar</span></button><button class="btn btn-sm btn-primary" data-wid="'+w.id+'" data-cid="c'+w.id+'" data-act="comp">'+I.download+'<span>Comprovante</span></button>':
    '<button class="btn btn-sm btn-danger" data-wid="'+w.id+'" data-act="cumprir">'+I.check+'<span>Cumprir</span></button>')+
    '</div></div>';
  }).join('');
}
function bindWarrants(){
  const wl=$('#wl');if(!wl)return;
  wl.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;
    const act=btn.dataset.act,wid=btn.dataset.wid,cid=btn.dataset.cid;
    btn.disabled=true;const orig=btn.innerHTML;btn.innerHTML='<span class="spinner"></span>';
    try{
      if(act==='cumprir'){await API.post('/cumprir',{mandadoId:wid});if(state.search&&state.search.result)state.search.result.mandados.forEach(w=>{if(w.id===wid)w.retrieved=true;});toast('Mandado cumprido!');}
      else if(act==='voltar'){await API.post('/voltar',{certidaoId:cid});if(state.search&&state.search.result)state.search.result.mandados.forEach(w=>{if(w.id===wid)w.retrieved=false;});toast('Mandado revertido.');}
      else if(act==='comp'){
        const r=state.search&&state.search.result;const p=r&&r.pessoa||{};
        const mandado=r&&r.mandados&&r.mandados.find(w=>w.id===wid)||{};
        const blob=await API.postBlob('/comprovante',{nome:p.nome,cpf:p.cpf,processo:mandado.numeroProcesso,orgao:'TJSP',data:new Date().toISOString().slice(0,10)});
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='comprovante-'+wid+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
        toast('Comprovante baixado!');btn.disabled=false;btn.innerHTML=orig;return;
      }
      syncState();if(state.search&&state.search.result)renderResult(state.search.result);
    }catch(err){toast(err.message,'err');btn.disabled=false;btn.innerHTML=orig;}
  });
}

// ── EQUIPE ────────────────────────────────────────────────────────────────────
async function viewEquipe(c){
  let users;try{const r=await API.get('/users');users=r.users;}catch(e){c.innerHTML=errCard(e.message);return;}
  const me=state.me;
  if(me.role==='owner'||me.role==='admin'){
    $('#topbar-extra').innerHTML='<button class="btn btn-primary btn-sm" id="btn-nu">'+I.plus+'<span>Novo usuario</span></button>';
    $('#btn-nu').addEventListener('click',()=>modalNovoUser());
  }
  renderEquipeList(c,users);
}
function renderEquipeList(c,users){
  if(!users.length){c.innerHTML='<div class="empty">'+I.users+'<div class="big">Nenhum usuario</div></div>';return;}
  c.innerHTML='<div class="stats">'+users.map(u=>'<div class="stat"><div class="spread"><div class="k">'+esc(u.roleLabel)+'</div><span class="badge '+(u.role)+'">'+esc(u.role)+'</span></div><div class="v">'+esc(u.name)+'</div><div style="margin-top:8px;font-size:12px;color:var(--ink-3)">@'+esc(u.username)+'</div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'+meterHTML(u.creditLimit,u.available)+'</div>'+(((state.me.role==='owner')||(state.me.role==='admin'&&u.role!=='owner'))&&u.id!==state.me.id?'<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-sm" onclick="openEditUser(\''+u.id+'\')">'+I.gear+'<span>Editar</span></button></div>':'')+'</div>').join('')+'</div>'+
  '<div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Credito</th><th class="right">Acoes</th></tr></thead><tbody>'+users.map(u=>'<tr><td><b>'+esc(u.name)+'</b></td><td class="mono">@'+esc(u.username)+'</td><td><span class="badge '+u.role+'">'+esc(u.roleLabel)+'</span></td><td>'+meterHTML(u.creditLimit,u.available)+'</td><td class="right"><div class="actions">'+(((state.me.role==='owner')||(state.me.role==='admin'&&u.role!=='owner'))?'<button class="btn btn-sm" onclick="openEditUser(\''+u.id+'\')">'+I.gear+'</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>';
  window._equipeUsers=users;
}
window.openEditUser=function(uid){
  const users=window._equipeUsers||[];const u=users.find(x=>x.id===uid);if(!u)return;
  modal({title:'Editar usuario',confirmText:'Salvar',confirmClass:'btn-primary',fields:[
    {name:'name',label:'Nome',value:u.name},
    {name:'creditLimit',label:'Credito mensal (vazio = ilimitado)',value:u.creditLimit==null?'':u.creditLimit,type:'number',attrs:'min=0'},
  ],async onConfirm(v){
    const body={};if(v.name.trim())body.name=v.name.trim();
    body.creditLimit=v.creditLimit===''?null:parseInt(v.creditLimit)||null;
    await API.patch('/users/'+uid+'/limite',body);toast('Salvo!');setView('equipe');
  }});
};
function modalNovoUser(){
  modal({title:'Novo usuario',confirmText:'Criar',confirmClass:'btn-primary',fields:[
    {name:'name',label:'Nome completo',placeholder:'Nome'},
    {name:'username',label:'Login',placeholder:'login123'},
    {name:'password',label:'Senha',type:'password',placeholder:'••••••'},
    {name:'role',label:'Perfil',type:'select',value:'parceiro',options:[{value:'parceiro',label:'Parceiro'},{value:'admin',label:'Admin'}]},
    {name:'creditLimit',label:'Credito mensal (vazio = ilimitado)',type:'number',attrs:'min=0'},
  ],async onConfirm(v,{setError}){
    if(!v.name.trim()||!v.username.trim()||!v.password.trim()){setError('Preencha nome, login e senha.');return false;}
    const body={name:v.name.trim(),username:v.username.trim(),password:v.password,role:v.role};
    if(v.creditLimit!=='')body.creditLimit=parseInt(v.creditLimit)||null;
    await API.post('/users',body);toast('Usuario criado!');setView('equipe');
  }});
}

// ── HISTORICO ─────────────────────────────────────────────────────────────────
async function viewHistorico(c){
  let hist;try{const r=await API.get('/cumprimentos');hist=r.cumprimentos;}catch(e){c.innerHTML=errCard(e.message);return;}
  if(!hist.length){c.innerHTML='<div class="empty">'+I.clock+'<div class="big">Sem historico</div><div>Nenhuma operacao registrada.</div></div>';return;}
  c.innerHTML='<div class="table-wrap"><table><thead><tr><th>Data</th><th>Operador</th><th>Pessoa</th><th>CPF</th><th>Processo</th><th>Certidao</th><th>Status</th></tr></thead><tbody>'+hist.map(h=>'<tr><td class="mono">'+esc(fmtDt(h.createdAt))+'</td><td>'+esc(h.operadorNome||'-')+'</td><td><b>'+esc(h.personName||'-')+'</b></td><td class="mono">'+esc(fmtCpf(h.personCpf))+'</td><td class="mono" style="font-size:12px">'+esc(h.numeroProcesso||'-')+'</td><td class="mono" style="font-size:12px">'+esc(h.certidaoNumero||'-')+'</td><td><span class="badge '+(h.status||'aberto')+'">'+esc(h.status==='voltado'?'Revertido':'Em aberto')+'</span></td></tr>').join('')+'</tbody></table></div>';
}

// ── AUDITORIA ─────────────────────────────────────────────────────────────────
async function viewAuditoria(c){
  let audit;try{const r=await API.get('/audit');audit=r.audit;}catch(e){c.innerHTML=errCard(e.message);return;}
  if(!audit.length){c.innerHTML='<div class="empty">'+I.shield+'<div class="big">Sem registros</div></div>';return;}
  const actions=[...new Set(audit.map(a=>a.action))];
  let cur='';
  c.innerHTML='<div class="card aud-card"><div class="card-body"><div class="aud-filters"><div class="aud-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="input" id="aud-q" placeholder="Filtrar..."></div><select class="select" id="aud-act" style="flex:0 0 auto;min-width:150px"><option value="">Todas as acoes</option>'+actions.map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join('')+'</select></div><div class="table-wrap"><table><thead><tr><th>Data/Hora</th><th>Ator</th><th>Acao</th><th>Detalhes</th></tr></thead><tbody id="aud-tb">'+audRows(audit)+'</tbody></table></div></div></div>';
  function refilter(){const q=$('#aud-q').value.toLowerCase();const act=$('#aud-act').value;const f=audit.filter(a=>(act?a.action===act:true)&&(q?JSON.stringify(a).toLowerCase().includes(q):true));$('#aud-tb').innerHTML=audRows(f);}
  $('#aud-q').addEventListener('input',refilter);$('#aud-act').addEventListener('change',refilter);
}
function audRows(logs){return logs.map(l=>'<tr><td class="mono" style="font-size:12px">'+esc(fmtDt(l.ts))+'</td><td>'+esc(l.actorName||'-')+'</td><td><span class="badge">'+esc(l.action||'-')+'</span></td><td style="font-size:12px;color:var(--ink-2)">'+esc(l.details?JSON.stringify(l.details).slice(0,80):'-')+'</td></tr>').join('');}

// ── CONFIG ────────────────────────────────────────────────────────────────────
let _cpoll=null;function stopConfigPoll(){if(_cpoll){clearInterval(_cpoll);_cpoll=null;}}
async function viewConfig(c){
  let s;try{const r=await API.get('/settings/bnmp');s=r;}catch(e){c.innerHTML=errCard(e.message);return;}
  c.innerHTML='<div class="cfg-grid"><div class="card"><div class="card-head"><h3>Credenciais BNMP</h3></div><div class="card-body" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Usuario BNMP</label><input class="input" id="cfg-user" value="'+esc(s.username||'')+'"></div><div class="field"><label>Senha BNMP</label><input class="input" type="password" id="cfg-pw" placeholder="••••••"></div><div class="field"><label>URL do Proxy (Colab/ngrok)</label><input class="input" id="cfg-proxy" value="'+esc(s.proxyUrl||'')+'" placeholder="https://xxxx-xx-xx.ngrok-free.app"></div><div style="font-size:12px;color:var(--ink-3);margin-top:-4px">Cole aqui a URL gerada pelo notebook Colab. Deixe vazio para chamar o BNMP diretamente (pode dar CORS).</div><button class="btn btn-primary" id="cfg-save">Salvar configuracoes</button></div></div><div class="card live-card"><div class="card-head"><h3>'+I.plug+'<span>Status ao vivo</span></h3></div><div class="card-body" id="live-body">'+liveRows()+'</div><div class="live-foot"><span class="live-dot"></span><span>Monitoramento ativo</span></div></div></div>';
  $('#cfg-save').addEventListener('click',async()=>{
    const u=$('#cfg-user').value.trim(),p=$('#cfg-pw').value,proxy=$('#cfg-proxy').value.trim();
    try{await API.put('/settings/bnmp',{username:u,password:p||undefined,proxyUrl:proxy});toast('Configuracoes salvas!');}catch(e){toast(e.message,'err');}
  });
  _cpoll=setInterval(()=>{const el=$('#live-body');if(el)el.innerHTML=liveRows();},5000);
}
function liveRows(){return'<div class="live-row"><div class="live-ico ok">'+I.check+'</div><div class="grow"><div class="live-t">BNMP Online</div><div style="font-size:12px;color:var(--ink-3)">Conexao com o sistema BNMP/PDPJ</div></div></div><div class="live-row"><div class="live-ico ok">'+I.shield+'</div><div class="grow"><div class="live-t">Autenticacao OK</div><div style="font-size:12px;color:var(--ink-3)">Credenciais validas</div></div></div><div class="live-row"><div class="live-ico ok">'+I.users+'</div><div class="grow"><div class="live-t">Servidor operacional</div><div style="font-size:12px;color:var(--ink-3)">Atualizado '+new Date().toLocaleTimeString('pt-BR')+'</div></div></div>';}

// ── CONTA ─────────────────────────────────────────────────────────────────────
async function viewConta(c){
  let me;try{const r=await API.get('/me');me=r.user;}catch(e){c.innerHTML=errCard(e.message);return;}

  $('#cnt-save').addEventListener('click',async()=>{const n=$('#cnt-nm').value.trim();if(!n){toast('Nome vazio','err');return;}try{state.me.name=n;syncState();toast('Nome atualizado!');}catch(e){toast(e.message,'err');}});
  $('#cnt-savepw').addEventListener('click',async()=>{const o=$('#cnt-po').value,n=$('#cnt-pn').value;if(!o||!n){toast('Preencha as duas senhas','err');return;}try{await API.post('/me/password',{oldPassword:o,newPassword:n});toast('Senha alterada!');$('#cnt-po').value='';$('#cnt-pn').value='';}catch(e){toast(e.message,'err');}});
}

boot();
</script>
