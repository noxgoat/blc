services:
  - type: web
    name: bnmp-backend
    runtime: node
    buildCommand: >
      apt-get update -y &&
      apt-get install -y chromium chromium-driver &&
      npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
